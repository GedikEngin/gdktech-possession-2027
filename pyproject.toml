[project]
name = "gdkb-submission"
version = "1.0.0"
description = "gdkBarcelona — per-frame team possession from Metrica automatic tracking data (Talent Arena 2027 More Than a Hack, Initial Challenge)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "gdkBarcelona team" }]
# The exact versions the submission file was generated with are in requirements.txt (hashes included);
# these ranges only document the API surface the code was written against.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "lxml==6.1.3",
    "lightgbm==4.7.0",
    "scipy==1.18.1",
    "torch==2.14.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gdkb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
